# Cloudflare Pages + D1. Salaisuudet EIVÄT kuulu tähän tiedostoon.
# Aseta ne komennolla: npx wrangler pages secret put ADMIN_PASSWORD
# ja: npx wrangler pages secret put SESSION_SECRET
# Paikallisesti arvot luetaan tiedostosta .dev.vars (ei versiohallintaan).
name = "laskuri"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "laskuri"
database_id = "00000000-0000-0000-0000-000000000000"
